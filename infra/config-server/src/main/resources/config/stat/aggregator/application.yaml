aggregator:
  kafka:
    event-similarity-producer-properties:
      bootstrap.servers: localhost:9092
      key.serializer: org.apache.kafka.common.serialization.LongSerializer
      value.serializer: ru.practicum.kafka.serializer.GeneralAvroSerializer
    user-action-consumer-properties:
      bootstrap.servers: localhost:9092
      group.id: aggregator-group
      auto.offset.reset: earliest
      key.deserializer: org.apache.kafka.common.serialization.LongDeserializer
      value.deserializer: ru.practicum.kafka.deserializer.UserActionDeserializer
      enable.auto.commit: false
    topics:
      user-actions: stats.user-actions.v1
      events-similarity: stats.events-similarity.v1

logging:
  level:
    ru.practicum: DEBUG
    org.springframework.web: DEBUG
    org.apache.kafka: DEBUG
    org.apache.http: DEBUG