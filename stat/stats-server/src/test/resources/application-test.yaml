spring:
  config:
    import: ""
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    sql:
      init:
        mode: never
    show-sql: true

eureka:
  client:
    enabled: false

server:
  port: 0